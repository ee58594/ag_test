<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoManager · 算法项目智能管理平台</title>
  <meta name="description" content="基于大模型能力的算法项目全生命周期管理平台，支持多 Agent 协作、迭代管理与智能分析。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     SIDEBAR
═══════════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="#6366F1"/>
          <path d="M6 14h4l3-6 4 12 3-8 3 2h3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">AlgoManager</span>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="收起侧边栏">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11 2L5 8l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">概览</div>
    <a class="nav-item active" data-view="dashboard" href="#">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".5"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor" opacity=".5"/></svg>
      <span>总览大盘</span>
    </a>

    <div class="nav-section-label">项目</div>
    <a class="nav-item" data-view="projects" href="#">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 3V2a1 1 0 011-1h4a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>项目列表</span>
    </a>
    <a class="nav-item" data-view="iterations" href="#">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 1 0 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 2l-2 2 2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>迭代历史</span>
    </a>

    <a class="nav-item" data-view="labs" href="#">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="4" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="5.5" cy="8.5" r="1" fill="currentColor"/></svg>
      <span>Lab 环境</span>
    </a>

    <div class="nav-section-label">Agent 场景</div>
    <a class="nav-item scenario-nav" data-scenario="1" data-view="scenario" href="#">
      <span class="scenario-icon">🚀</span><span>初始建模</span>
    </a>
    <a class="nav-item scenario-nav" data-scenario="2" data-view="scenario" href="#">
      <span class="scenario-icon">📊</span><span>迭代优化分析</span>
    </a>
    <a class="nav-item scenario-nav" data-scenario="3" data-view="scenario" href="#">
      <span class="scenario-icon">🔍</span><span>运营复盘</span>
    </a>
    <a class="nav-item scenario-nav" data-scenario="4" data-view="scenario" href="#">
      <span class="scenario-icon">💼</span><span>业务驱动优化</span>
    </a>
    <a class="nav-item scenario-nav" data-scenario="5" data-view="scenario" href="#">
      <span class="scenario-icon">❓</span><span>业务问题分析</span>
    </a>
    <a class="nav-item scenario-nav" data-scenario="6" data-view="scenario" href="#">
      <span class="scenario-icon">📈</span><span>监控大盘</span>
    </a>
  </nav>

  <!-- Project picker (shown in sidebar) -->
  <div class="sidebar-project">
    <div class="sidebar-project-label">当前项目</div>
    <select id="sidebarProjectPicker" class="project-picker-select">
      <option value="">加载中...</option>
    </select>
  </div>
</aside>

<!-- ══════════════════════════════════════════════════════════
     MAIN CONTENT
═══════════════════════════════════════════════════════════ -->
<div class="layout-main" id="layoutMain">

  <!-- Top bar -->
  <header class="topbar">
    <button class="topbar-menu-btn" id="topbarMenuBtn" aria-label="展开侧边栏">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <h1 class="topbar-title" id="topbarTitle">总览大盘</h1>
    <div class="topbar-actions">
      <button class="btn-outline btn-sm" id="btnNewProject">+ 新建项目</button>
    </div>
  </header>

  <!-- ── VIEW: Dashboard ── -->
  <section class="view" id="view-dashboard">
    <div class="stat-grid" id="statGrid"></div>
    <div class="dash-row">
      <div class="panel flex-2" id="panelIterChart">
        <div class="panel-header">
          <span class="panel-title">各场景迭代分布</span>
        </div>
        <div class="panel-body">
          <div id="scenarioChart" style="height:220px;width:100%"></div>
        </div>
      </div>
      <div class="panel flex-1" id="panelRecentIter">
        <div class="panel-header"><span class="panel-title">近期迭代</span></div>
        <div class="panel-body" id="recentIterList"></div>
      </div>
    </div>
  </section>

  <!-- ── VIEW: Projects ── -->
  <section class="view hidden" id="view-projects">
    <div class="project-grid" id="projectGrid"></div>
  </section>

  <!-- ── VIEW: Iterations ── -->
  <section class="view hidden" id="view-iterations">
    <div class="iter-filters">
      <select id="filterProject" class="filter-select">
        <option value="">全部项目</option>
      </select>
      <select id="filterScenario" class="filter-select">
        <option value="">全部场景</option>
        <option value="1">🚀 初始建模</option>
        <option value="2">📊 迭代优化分析</option>
        <option value="3">🔍 运营复盘</option>
        <option value="4">💼 业务驱动优化</option>
        <option value="5">❓ 业务问题分析</option>
        <option value="6">📈 监控大盘</option>
      </select>
    </div>
    <div id="iterationsTable"></div>
  </section>

  <!-- ── VIEW: Project Detail ── -->
  <section class="view hidden" id="view-project-detail">
    <div class="project-detail-header">
      <button class="btn-ghost btn-sm back-btn" id="btnBackToProjects">← 返回项目列表</button>
    </div>
    <div id="projectDetailContent"></div>
  </section>

  <!-- ── VIEW: Iteration Detail ── -->
  <section class="view hidden" id="view-iteration-detail">
    <div class="project-detail-header">
      <button class="btn-ghost btn-sm back-btn" id="btnBackToIterations">← 返回迭代列表</button>
    </div>
    <div id="iterationDetailContent"></div>
  </section>

  <!-- ── VIEW: Labs ── -->
  <section class="view hidden" id="view-labs">
    <div class="labs-header">
      <button class="btn-primary btn-sm" id="btnNewLab">+ 注册 Lab 环境</button>
    </div>
    <div id="labsGrid"></div>
  </section>

  <!-- ── VIEW: Scenario (Agent Run) ── -->
  <section class="view hidden" id="view-scenario">
    <div class="scenario-layout">
      <!-- Left: Config panel -->
      <div class="scenario-config" id="scenarioConfig">
        <div class="scenario-hero" id="scenarioHero">
          <div class="scenario-hero-icon" id="scenarioHeroIcon"></div>
          <div>
            <div class="scenario-hero-name" id="scenarioHeroName"></div>
            <div class="scenario-hero-desc" id="scenarioHeroDesc"></div>
          </div>
        </div>

        <!-- 需求输入 -->
        <div class="config-section">
          <label class="config-label">需求描述 <span style="color:var(--red-500)">*</span></label>
          <textarea id="agentRequirement" class="config-textarea"
            placeholder="用自然语言描述本次分析目标，例如：&#10;· 提升大促期间预测精度至MAPE≤20%&#10;· 分析近期补货偏低的原因&#10;· 根据供应链需求优化预测粒度"
            rows="4" maxlength="500"></textarea>
          <div class="char-count" id="reqCharCount">0 / 500</div>
        </div>

        <div class="config-section">
          <label class="config-label">选择项目</label>
          <select id="agentProjectPicker" class="config-select"></select>
        </div>

        <div class="config-section">
          <label class="config-label">目标 Lab 环境</label>
          <select id="agentLabPicker" class="config-select">
            <option value="">自动选择（根据项目绑定）</option>
          </select>
          <div class="lab-status-row" id="labStatusRow" style="display:none"></div>
        </div>

        <div class="config-section" id="agentConfigExtra"></div>

        <div class="config-section">
          <div class="agent-roster" id="agentRoster"></div>
        </div>

        <button class="btn-primary btn-run" id="btnRunAgent" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2l10 6-10 6V2z" fill="currentColor"/></svg>
          启动 Agent 分析
        </button>
      </div>

      <!-- Right: Streaming dialogue -->
      <div class="scenario-stream" id="scenarioStream">
        <!-- Stage progress bar -->
        <div class="stage-bar hidden" id="stageBar">
          <div class="stage-step" data-stage="1">
            <div class="stage-dot"></div>
            <span>需求解析</span>
          </div>
          <div class="stage-connector"></div>
          <div class="stage-step" data-stage="2">
            <div class="stage-dot"></div>
            <span>生成代码</span>
          </div>
          <div class="stage-connector"></div>
          <div class="stage-step" data-stage="3">
            <div class="stage-dot"></div>
            <span>Lab 执行</span>
          </div>
          <div class="stage-connector"></div>
          <div class="stage-step" data-stage="4">
            <div class="stage-dot"></div>
            <span>结果解读</span>
          </div>
        </div>

        <div class="stream-placeholder" id="streamPlaceholder">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#E0E7FF" stroke-width="2"/><path d="M20 32h8l4-8 4 16 4-10 4 2" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p>填写需求描述并启动 Agent，4阶段协作分析将在此处实时展示</p>
        </div>
        <div class="stream-messages hidden" id="streamMessages"></div>
        <div class="stream-done hidden" id="streamDone">
          <div class="done-badge">✅ 分析完成</div>
          <p class="done-note" id="streamDoneNote"></p>
          <button class="btn-outline btn-sm" id="btnViewNewIter">查看本次迭代记录</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ── VIEW: Monitoring (Scenario 6 special) ── -->
  <section class="view hidden" id="view-monitoring">
    <div id="monitoringContent"></div>
  </section>

</div>

<!-- ══════════════════════════════════════════════════════════
     MODAL: New Project
═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalNewProject">
    <div class="modal-header">
      <span class="modal-title">新建算法项目</span>
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <label class="form-label">项目名称 <span class="required">*</span></label>
      <input type="text" id="inputProjectName" class="form-input" placeholder="例：用户购买意向预测" maxlength="60" />

      <label class="form-label">项目描述</label>
      <textarea id="inputProjectDesc" class="form-input form-textarea" placeholder="简要描述项目目标和数据背景" rows="3"></textarea>

      <label class="form-label">预测类型</label>
      <select id="inputProjectType" class="form-input">
        <option value="timeseries">时序预测</option>
        <option value="classification">分类预测</option>
        <option value="regression">回归预测</option>
        <option value="optimization">策略优化</option>
        <option value="anomaly">异常检测</option>
      </select>

      <label class="form-label">标签（逗号分隔）</label>
      <input type="text" id="inputProjectTags" class="form-input" placeholder="例：销量预测, 时序, SKU" />
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="btnModalCancel">取消</button>
      <button class="btn-primary" id="btnModalCreate">创建项目</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     MODAL: New Lab
═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modalLabOverlay">
  <div class="modal" id="modalNewLab">
    <div class="modal-header">
      <span class="modal-title">注册 Lab 环境</span>
      <button class="modal-close" id="modalLabClose">×</button>
    </div>
    <div class="modal-body">
      <label class="form-label">Lab 名称 <span class="required">*</span></label>
      <input type="text" id="inputLabName" class="form-input" placeholder="例：Lab-销量预测环境" maxlength="60" />

      <label class="form-label">JupyterLab URL <span class="required">*</span></label>
      <input type="url" id="inputLabUrl" class="form-input" placeholder="https://lab.mycompany.com" />

      <label class="form-label">Access Token <span class="required">*</span></label>
      <input type="password" id="inputLabToken" class="form-input" placeholder="Jupyter Server Token" />

      <label class="form-label">内核名称</label>
      <input type="text" id="inputLabKernel" class="form-input" value="python3" />

      <label class="form-label">备注说明</label>
      <textarea id="inputLabNote" class="form-input form-textarea" placeholder="环境配置、所属项目等说明" rows="2"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="btnLabModalCancel">取消</button>
      <button class="btn-primary" id="btnLabModalCreate">注册并测试连通性</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     SCRIPTS
═══════════════════════════════════════════════════════════ -->
<!-- Apache ECharts 5 — rich interactive charts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"
        onerror="console.warn('ECharts CDN failed')"></script>

<!-- marked — production-grade Markdown parser (MIT) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"
        onerror="console.warn('marked CDN failed')"></script>

<!-- highlight.js — syntax highlighting for 190+ languages (BSD-3) -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"
        onerror="console.warn('highlight.js CDN failed')"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>

<!-- DOMPurify — XSS sanitiser for untrusted HTML (Apache-2.0) -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"
        onerror="console.warn('DOMPurify CDN failed')"></script>

<script src="app.js"></script>
</body>
</html>
